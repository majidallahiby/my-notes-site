<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📓 عرض الملاحظات (Realtime)</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>


body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #f0f0f0;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    margin: 0;
    padding-top: 50px;
    direction: rtl;
    font-size: 24px; /* بدل 16px سابقًا */
}

#screenNoise {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none; /* ما يوقف أي تفاعل */
    background-image: url(''); /* نملأه بالـ JS */
    opacity: 0.5; /* شفاف جداً */
    z-index: 9999;
}



    .container {
    background: #f8f8f8;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.15);

    /* حجم المربع ملائم للشاشة */
    width: 90%;            /* 90% من عرض الشاشة */


    height: auto;          /* الارتفاع حسب المحتوى */
    max-height: 80vh;      /* أقصى ارتفاع 80% من ارتفاع الشاشة */
    overflow-y: auto;      /* شريط تمرير إذا زاد المحتوى */

    display: flex;
    flex-direction: column;
    align-items: stretch;
}

 .header {
    display: flex;
    justify-content: space-between; /* العنوان جهة اليمين والأزرار جهة اليسار */
    align-items: center;
    direction: rtl;
    margin-bottom: 15px;
}

.header-left {
    display: flex;
    align-items: center;
}

.header-left h2 {
    margin: 0;
    order: 2;
}

.header-left img {
    width: 24px;
    height: 24px;
    margin-left: 10px;
    order: 1;
}


.header-center {
    flex: 1;
    text-align: center;
    font-size: 30px;
    font-weight: bold;
}


.header-right {
    display: flex;
    gap: 5px; /* مسافة صغيرة بين الأزرار */
}

.header-right button {
    padding: 6px 35px; /* صغير الحجم */
    font-size: 24px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    transition: all 0.2s ease;
}

/* تأثير hover و active */
.header-right button:hover { filter: brightness(1.1); }
.header-right button:active { filter: brightness(0.9); }

/* إذا أردت تخصيص لون لكل زر */
#increaseFont { background-color: #28a745; }
#decreaseFont { background-color: #ffc107; color: black; }
#showMsg { background-color: #dc3545; }
#darkmode { background-color:#303030; color:#FAFAFA; }



.notes-scroll-wrapper {
    height: 300px; /* أو حسب مساحة الصفحة */
    overflow: hidden; /* يخفي ما يخرج عن المربع */
    position: relative;
}

.notes-list {
    display: flex;
    flex-direction: column;
    position: absolute;
    bottom: -100%; /* البداية من أسفل */
    animation: scrollNotes 25s linear infinite;
}

.notes-list li {
    margin-bottom: 6px;
    padding: 10px 12px;
    border-radius: 6px;
    background: #f2f2f2;
    cursor: pointer;
    transition: background 0.2s ease;
}

@keyframes scrollNotes {
    0%   { bottom: -100%; }
    100% { bottom: 100%; } /* تتحرك لأعلى خارج المربع */
}



.notes-scroll-wrapper:hover .notes-list {
    animation-play-state: paused;
}




/* التحديد */
.notes-list li.selected {
    background: #d1e7dd;
}

/* نص الملاحظة */
.note-text {
    line-height: 1.5;
}

/* التاريخ (مخفي افتراضيًا) */
.note-time {
    font-size: 16px;
    color: #666;
    margin-top: 4px;
    display: none;
}

/* يظهر عند hover */
.notes-list li:hover .note-time {
    display: block;
}

/* يظهر عند التحديد */
.notes-list li.selected .note-time {
    display: block;
}



body.dark-mode {
    background: #121212;
    color: #eaeaea;
}

body.dark-mode .container {
    background: #1e1e1e;
}

body.dark-mode .notes-list li {
    background: #2a2a2a;
    color: #f1f1f1;
}

body.dark-mode .notes-list li.selected {
    background: #355f4b;
}

body.dark-mode textarea {
    background: #2a2a2a;
    color: #fff;
    border-color: #444;
}

body.dark-mode .note-time {
    color: #aaa;
}

body.dark-mode button {
    background: #333;
    color: #fff;
}

body.dark-mode button:hover {
    background: #444;
}

body.dark-mode button:active {
    background: #222;
}
body.dark-mode #darkmode{
    background: #f0f0f0;
}



</style>
</head>
<body>
    <div id="screenNoise"></div>

<div class="container">
   <div class="header">
    <div class="header-left">
        <h2>الملاحظات اليومية</h2>
        <img src="https://img.icons8.com/material-outlined/24/000000/pencil--v1.png" alt="قلم">
    </div>
                              <!-- الساعة في الوسط -->
    <div class="header-center">
        <span id="clock">00:00:00 AM</span>
    </div>
    <div class="header-right">
        <button id="increaseFont">+</button>
        <button id="decreaseFont">-</button>
        <button id="showMsg">!</button>
        <button id="darkmode">🌙</button>

    </div>
</div>

<div class="notes-scroll-wrapper">


    <ul class="notes-list" id="notesList"> </li>

    </ul>

    </div>

</div>
<script>
/* ------------------- إعداد Supabase ------------------- */
const SUPABASE_URL = "https://ecikwipkukvyqipejlay.supabase.co"; // ضع هنا رابط المشروع
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVjaWt3aXBrdWt2eXFpcGVqbGF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM1NzIxMzEsImV4cCI6MjA3OTE0ODEzMX0.LXeXcwG00I4yaNQrlGeZCMDTllecH6QyUpB9BTrCY08"; // ضع هنا ANON_KEY
window.supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const notesList = document.getElementById("notesList");
/*--------------دالة تنسيق التاريخ------------------------*/
function formatDate(dateString) {
    const d = new Date(dateString);
    return d.toLocaleString("en-EG", {
        hour: "numeric",
        minute: "2-digit",
        hour12: true,
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
    });
}





/* ------------------- تحميل الملاحظات ------------------- */
async function loadNotes() {
    const { data, error } = await supabaseClient
        .from("notes")
        .select("*")
        .order("id", { ascending: true });

    if (error) { alert("خطأ في تحميل الملاحظات"); return; }

    notesList.innerHTML = "";
    //data.forEach(note => addNoteToList(note));
    data.forEach(n => {
    const li = document.createElement("li");

    const noteText = document.createElement("span");
    noteText.className = "note-text";
    noteText.textContent = n.text;

    const noteTime = document.createElement("span");
    noteTime.className = "note-time";
    noteTime.textContent =" (";
    noteTime.textContent += formatDate(n.updated_at || n.created_at);
    noteTime.textContent +=")";


    li.appendChild(noteText);
    li.appendChild(noteTime);

    notesList.appendChild(li);
});

}

/* ------------------- إضافة ملاحظة للقائمة ------------------- */
function addNoteToList(note) {
    const li = document.createElement("li");
    li.textContent = note.text;
    li.dataset.id = note.id;

    // إزالة إذا موجودة مسبقاً
    const existing = notesList.querySelector(`li[data-id='${note.id}']`);
    if (existing) existing.replaceWith(li);
    else notesList.appendChild(li);
}

/* ------------------- Realtime ------------------- */
supabaseClient
    .channel('public:notes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'notes' }, payload => {
        if (payload.eventType === 'INSERT' || payload.eventType === 'UPDATE') {
            addNoteToList(payload.new);
        } else if (payload.eventType === 'DELETE') {
            const li = notesList.querySelector(`li[data-id='${payload.old.id}']`);
            if (li) li.remove();
        }
    loadNotes();
    })
    .subscribe();
/* ------------------- تحميل أولي ------------------- */
loadNotes();




//const notesList = document.querySelector(".notes-list");
let currentFontSize = 24; // حجم الخط الافتراضي

document.getElementById("increaseFont").addEventListener("click", () => {
    currentFontSize += 2;
    notesList.style.fontSize = currentFontSize + "px";
});

document.getElementById("decreaseFont").addEventListener("click", () => {
    if(currentFontSize > 8) currentFontSize -= 2;
    notesList.style.fontSize = currentFontSize + "px";
});

document.getElementById("showMsg").addEventListener("click", () => {
    alert("تصميم ماجد اللهيبي");
});


const themeBtn = document.getElementById("darkmode");

themeBtn.addEventListener("click", () => {
    document.body.classList.toggle("dark-mode");

    // تغيير الأيقونة حسب الوضع
    if (document.body.classList.contains("dark-mode")) {
        themeBtn.textContent = "☀️";
    } else {
        themeBtn.textContent = "🌙";
    }
});

/* .......................................................*/
const noiseDiv = document.getElementById('screenNoise');

function generateNoise() {
    const canvas = document.createElement('canvas');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const ctx = canvas.getContext('2d');

    const imageData = ctx.createImageData(canvas.width, canvas.height);
    for (let i = 0; i < imageData.data.length; i += 4) {
        const shade = Math.floor(Math.random() * 256);
        imageData.data[i] = shade;
        imageData.data[i + 1] = shade;
        imageData.data[i + 2] = shade;
        imageData.data[i + 3] = 15; // 0-255, الشفافية قليلة
    }
    ctx.putImageData(imageData, 0, 0);
    noiseDiv.style.backgroundImage = `url(${canvas.toDataURL()})`;
}

// كل نصف ثانية نغير الضوضاء
setInterval(generateNoise, 5000);

/*.......................................................*/









function updateClock() {
    const clockEl = document.getElementById("clock");
    const now = new Date();
    let hours = now.getHours();
    const minutes = now.getMinutes();
    const seconds = now.getSeconds();
    const ampm = hours >= 12 ? "PM" : "AM";

    hours = hours % 12;
    hours = hours ? hours : 12; // الساعة 12 بدل 0

    const formattedTime =
        String(hours).padStart(2,'0') + ":" +
        String(minutes).padStart(2,'0') + ":" +
        String(seconds).padStart(2,'0') + " " + ampm;

    clockEl.textContent = formattedTime;
}

// تحديث كل ثانية
setInterval(updateClock, 1000);
updateClock(); // استدعاء فور تحميل الصفحة



</script>

</body>
</html>
