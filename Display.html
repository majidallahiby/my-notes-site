<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📓 عرض الملاحظات (Realtime)</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
    body {
    display: flex;
    flex-direction: column; /* header + container + footer يتحركون مع بعض */
/*    align-items: center;    /* محتوى الصفحة بالوسط */
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #f0f0f0;
        height: 100vh; /* مهم جداً */
    margin: 0;
    padding: 0;
    font-size: 24px;
}

.header {
    width: 90%;
    margin: 5px auto;
    display: flex;
    align-items: center;
}

.header-left {
    flex: 1;
    text-align: right;
}

.header-center {
    flex: 1;
    text-align: right;
    font-size: 30px;
    font-weight: bold;
}

.header-right {
/*    flex: 1; */
    text-align: left;
    display: flex;
    gap: 5px;
    justify-content: flex-start;
}


/* ================= footer ================= */
.app-footer {
    font-size: 14px;
    color: #666;
    display: flex;
    justify-content: space-between;
    width: 90%;
  /*  max-width: 600px; */
    margin: 10px auto 10px auto; /* يتبع الـ container */
    direction: rtl;
}
.app-footer {
    width: 90%;
    margin: 10px auto 15px auto;
    font-size: 14px;
    display: flex;
    justify-content: space-between;
}


.app-footer .footer-center {
    margin: 0 auto;
}

.app-footer .footer-right {
    white-space: nowrap;
}

body.dark-mode .app-footer {
    color: #aaa;
}


.header-right button {
    padding: 4px 4px; /* صغير الحجم */
    font-size: 24px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    transition: all 0.2s ease;
}

/* تأثير hover و active */
.header-right button:hover { filter: brightness(1.1); }
.header-right button:active { filter: brightness(0.9); }


#screenNoise {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none; /* ما يوقف أي تفاعل */
    background-image: url(''); /* نملأه بالـ JS */
    opacity: 0.5; /* شفاف جداً */
    z-index: 9999;
}


.container {
    width: 90%;
    margin: 0 auto;
    flex: 1;              /* 🔑 المفتاح */
    background: #f8f8f8;
    border-radius: 15px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}


/* إذا أردت تخصيص لون لكل زر */
#toggleScroll { background-color: #9c27b0; }
#increaseFont { background-color: #28a745; }
#decreaseFont { background-color: #ffc107; color: black; }
#showMsg { background-color: #1B36CC; }
#darkmode { background-color:#303030; color:#FAFAFA; }

.notes-scroll-wrapper {
    position: relative;
    overflow: hidden;
        flex: 1;
}

.notes-list {
    position: absolute;
    width: 100%;
    top: 0;
}

.notes-scroll-wrapper.scrollable {
    overflow-y: auto; /* عند توقف الحركة */
}




.notes-list li {
    margin-bottom: 6px;
    padding: 10px 12px;
    border-radius: 6px;
    background: #f2f2f2;
    cursor: pointer;
    transition: background 0.2s ease;

    /* --- أضف هذه الأسطر --- */
    overflow-wrap: break-word; /* يقسم الكلمات الطويلة */
    word-wrap: break-word;     /* دعم قديم */
    hyphens: auto;             /* يسمح بفواصل في الكلمات إذا ممكن */
    max-width: 95%;           /* لا تتجاوز عرض container */
    box-sizing: border-box;    /* يشمل padding ضمن العرض */
}




/* التحديد */
.notes-list li.selected {
    background: #d1e7dd;
}

/* نص الملاحظة */
.note-text {
    line-height: 1.5;
}

/* التاريخ (مخفي افتراضيًا) */
.note-time {
    font-size: 16px;
    color: #666;
    margin-top: 4px;
    display: none;
}

/* يظهر عند hover */
.notes-list li:hover .note-time {
    display: block;
}

/* يظهر عند التحديد */
.notes-list li.selected .note-time {
    display: block;
}



/* وضع العرض الثابت (بدون حركة) */
.notes-list.static {
    animation: none !important;
    position: static;
}



body.dark-mode {
    background: #121212;
    color: #eaeaea;
}

body.dark-mode .container {
    background: #1e1e1e;
}

body.dark-mode .notes-list li {
    background: #2a2a2a;
    color: #f1f1f1;
}

body.dark-mode .notes-list li.selected {
    background: #355f4b;
}

body.dark-mode textarea {
    background: #2a2a2a;
    color: #fff;
    border-color: #444;
}

body.dark-mode .note-time {
    color: #aaa;
}

body.dark-mode button {
    background: #333;
    color: #fff;
}

body.dark-mode button:hover {
    background: #444;
}

body.dark-mode button:active {
    background: #222;
}
body.dark-mode #toggleScroll { background-color: #E585E5; }
body.dark-mode #increaseFont { background-color: #8CE3A0; }
body.dark-mode #decreaseFont { background-color: #FFDA6B; color: black; }
body.dark-mode #showMsg { background-color: #6F81EC; }
body.dark-mode #darkmode { background-color:#f0f0f0; color:#FAFAFA; }





/* Flash */
#screenFlash {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none; /* لا يعيق أي تفاعل */
    background-color: rgba(0, 0, 0, 0.5); /* اللون الافتراضي للتنبيه */
    opacity: 0;
    z-index: 9999;
    transition: opacity 0.1s ease; /* تأثير fade-in/out */
}

body.dark-mode #screenFlash {
    background-color: rgba(255, 255, 255, 0.5); /* لون مناسب للوضع المظلم */
}




</style>
</head>
<header class="header">

    <div class="header-left">
          <h2 class="page-title">
 📝 الملاحظات اليومية
</h2>
    </div>
                              <!-- الساعة في الوسط -->
    <div class="header-center">
        <span id="clock">00:00:00 AM</span>
    </div>
    <div class="header-right">
        <button id="toggleScroll">⏹️</button>
        <button id="darkmode">🌙</button>
        <button id="increaseFont">➕</button>
        <button id="decreaseFont">➖</button>
        <button id="showMsg">💬</button>
    </div>
</header>

<body>
<div id="screenFlash"></div>
<div id="screenNoise"></div>
<div class="container">


<div class="notes-scroll-wrapper">


    <ul class="notes-list" id="notesList"> </li>

    </ul>

    </div>
    </div>


<footer class="app-footer">
    <span class="footer-center">© <span id="year"></span> جميع الحقوق محفوظة – تصميم وتنفيذ شعبة تقنية المعلومات (IT)</span>
    <span class="footer-right">Majid Allahiby</span>
</footer>


<script>
/* ------------------- إعداد Supabase ------------------- */
const SUPABASE_URL = "https://ecikwipkukvyqipejlay.supabase.co"; // ضع هنا رابط المشروع
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVjaWt3aXBrdWt2eXFpcGVqbGF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM1NzIxMzEsImV4cCI6MjA3OTE0ODEzMX0.LXeXcwG00I4yaNQrlGeZCMDTllecH6QyUpB9BTrCY08"; // ضع هنا ANON_KEY
window.supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const NameTable = "notes";
//const NameTable = "test_notes";

const notesList = document.getElementById("notesList");
/*--------------دالة تنسيق التاريخ------------------------*/
function formatDate(dateString) {
    const d = new Date(dateString);
    return d.toLocaleString("en-GB", {
        hour: "numeric",
        minute: "2-digit",
        hour12: true,
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
    });
}





/* ------------------- تحميل الملاحظات ------------------- */
async function loadNotes() {
    const { data, error } = await supabaseClient
        .from(NameTable)
        .select("*")
        .order("id", { ascending: true });

    if (error) { alert("خطأ في تحميل الملاحظات"); return; }

    notesList.innerHTML = "";
    //data.forEach(note => addNoteToList(note));
    data.forEach(n => {
    const li = document.createElement("li");

    const noteText = document.createElement("span");
    noteText.className = "note-text";
    noteText.textContent = n.text;

    const noteTime = document.createElement("span");
    noteTime.className = "note-time";
    noteTime.textContent =" (";
    noteTime.textContent += formatDate(n.updated_at || n.created_at);
    noteTime.textContent +=")";


    li.appendChild(noteText);
    li.appendChild(noteTime);

    notesList.appendChild(li);
});

// بعد كل عملية INSERT أو UPDATE أو DELETE
flashScreen();

}

/* ------------------- إضافة ملاحظة للقائمة ------------------- */
function addNoteToList(note) {
    const li = document.createElement("li");
    li.textContent = note.text;
    li.dataset.id = note.id;

    // إزالة إذا موجودة مسبقاً
    const existing = notesList.querySelector(`li[data-id='${note.id}']`);
    if (existing) existing.replaceWith(li);
    else notesList.appendChild(li);
}

/* ------------------- Realtime ------------------- */
supabaseClient
    .channel('public:'+NameTable)
    .on('postgres_changes', { event: '*', schema: 'public', table: NameTable }, payload => {
        if (payload.eventType === 'INSERT' || payload.eventType === 'UPDATE') {
            addNoteToList(payload.new);
        } else if (payload.eventType === 'DELETE') {
            const li = notesList.querySelector(`li[data-id='${payload.old.id}']`);
            if (li) li.remove();
        }
    loadNotes();
    })
    .subscribe();
/* ------------------- تحميل أولي ------------------- */
loadNotes();




//const notesList = document.querySelector(".notes-list");
let currentFontSize = 24; // حجم الخط الافتراضي

document.getElementById("increaseFont").addEventListener("click", () => {
    currentFontSize += 2;
    notesList.style.fontSize = currentFontSize + "px";
});

document.getElementById("decreaseFont").addEventListener("click", () => {
    if(currentFontSize > 8) currentFontSize -= 2;
    notesList.style.fontSize = currentFontSize + "px";
});

document.getElementById("showMsg").addEventListener("click", () => {
   const msg="\n"+"تصميم وتنفيذ شعبة تقنية المعلومات"+ " (IT)" + "\n"
        + "\n" + "ماجد جمال اللهيبي" + "\n"
        + "\n" +  "احمـد ابـراهيم مـداح" + "\n"
        +  "\n" + "عــمـر عـاصـم نـاجي" ; + "\n"
        alert(msg);
});

/*................الوضع المظلم..........................*/
const themeBtn = document.getElementById("darkmode");

themeBtn.addEventListener("click", () => {
    document.body.classList.toggle("dark-mode");

    // تغيير الأيقونة حسب الوضع
    if (document.body.classList.contains("dark-mode")) {
        themeBtn.textContent = "☀️";
    } else {
        themeBtn.textContent = "🌙";
    }
});

/* .......................................................*/
const noiseDiv = document.getElementById('screenNoise');

function generateNoise() {
    const canvas = document.createElement('canvas');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const ctx = canvas.getContext('2d');

    const imageData = ctx.createImageData(canvas.width, canvas.height);
    for (let i = 0; i < imageData.data.length; i += 4) {
        const shade = Math.floor(Math.random() * 256);
        imageData.data[i] = shade;
        imageData.data[i + 1] = shade;
        imageData.data[i + 2] = shade;
        imageData.data[i + 3] = 20; // 0-255, الشفافية قليلة
    }
    ctx.putImageData(imageData, 0, 0);
    noiseDiv.style.backgroundImage = `url(${canvas.toDataURL()})`;
}

// كل نصف ثانية نغير الضوضاء
setInterval(generateNoise, 3600000);

/*.......................................................*/

/*.......................................................*/
const notesList2 = document.querySelector('.notes-list');

notesList.addEventListener('mouseenter', (e) => {
    if(e.target.tagName === 'LI') {
        notesList2.style.animationPlayState = 'paused';
    }
}, true);

notesList.addEventListener('mouseleave', (e) => {
    if(e.target.tagName === 'LI') {
        notesList2.style.animationPlayState = 'running';
    }
}, true);

/*......................................................*/

/*............... حركة الملاحظات ......................*/
const wrapper = document.querySelector('.notes-scroll-wrapper');
const list = document.querySelector('.notes-list');

let offset = wrapper.offsetHeight;
let speed = 0.3; // سرعة الحركة
let isRunning = true;

function animateNotes() {
    if (!isRunning) return;

    offset -= speed;
    list.style.transform = `translateY(${offset}px)`;

    const listHeight = list.offsetHeight;

    // أول ما آخر ملاحظة تطلع بالكامل
    if (offset <= -listHeight) {
        offset = wrapper.offsetHeight;
    }

    requestAnimationFrame(animateNotes);
}

// تشغيل أولي
animateNotes();


/*...........................................................*/




/*..............تشغيل الحركة وايقافها.......................*/
const toggleScrollBtn =document.getElementById("toggleScroll");
toggleScrollBtn.addEventListener('click', () => {
    isRunning = !isRunning;

    if (isRunning) {
        requestAnimationFrame(animateNotes);
        toggleScrollBtn.textContent = "⏹️";
        wrapper.classList.remove('scrollable'); // منع التمرير
    } else {
        // إلغاء الحركة وإظهار كل الملاحظات
        list.style.transform = 'translateY(0)';
        toggleScrollBtn.textContent = "▶️";
        wrapper.classList.add('scrollable'); // السماح بالتمرير
    }
});
/*.....................................................*/

/*................Flash................................*/
function flashScreen() {
    const flash = document.getElementById('screenFlash');
    flash.style.opacity = '1'; // يظهر التنبيه
    setTimeout(() => {
        flash.style.opacity = '0'; // يختفي بعد 300ms
    }, 500);
}
/*....................................................*/

/*.............. footer ..............................*/
// تحديث السنة تلقائيًا
document.getElementById('year').textContent = new Date().getFullYear();

// إخفاء footer عند عدم حركة الماوس لمدة 3 ثواني
let footer = document.querySelector('.app-footer');
let timeoutId;

function showFooter() {
    footer.style.opacity = '0.8';
    clearTimeout(timeoutId);
    timeoutId = setTimeout(() => {
        footer.style.opacity = '0';
    }, 5000);
}

// عند تحريك الماوس نعيد الظهور
document.addEventListener('mousemove', showFooter);

// تشغيل لأول مرة
showFooter();

/*...................................................*/

/*..................الساعة....................*/
function updateClock() {
    const clockEl = document.getElementById("clock");
    if (!clockEl) return;

    const now = new Date();
    let hours = now.getHours();   // ✅ let وليس const
    const minutes = now.getMinutes();
    const seconds = now.getSeconds();
    const ampm = hours >= 12 ? "PM" : "AM";
     const reloadTimes = [7, 18]; // 7 صباحًا و6 مساءً
    reloadTimes.forEach(hour => {
        if (hours === hour && minutes === 0 && seconds === 0) {
            location.reload(); // إعادة تحميل الصفحة
            }
    });


    hours = hours % 12;
    hours = hours ? hours : 12; // الساعة 12 بدل 0

    const formattedTime =
        String(hours).padStart(2,'0') + ":" +
        String(minutes).padStart(2,'0') + ":" +
        String(seconds).padStart(2,'0') + " " + ampm;

    clockEl.textContent = formattedTime;
}

setInterval(updateClock, 1000);
updateClock();
/*...........................................................*/

/*..................تغير الوضع الليلي اوتوماتيك......................*/
function autoDarkMode() {
    const now = new Date();
    const hour = now.getHours(); // 0 → 23
    const body = document.body;

    // من 6 مساءً إلى 7 صباحًا
    if (hour >= 18 || hour < 7) {
        body.classList.add("dark-mode");
    } else {
        body.classList.remove("dark-mode");
    }
}
// تشغيل عند فتح الصفحة
autoDarkMode();
/*...........................................................*/


</script>



</body>
