<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>📓 كتابة الملاحظات</title>
<style>
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: #f0f4f8;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
  margin: 0;
  padding-top: 50px;
  direction: rtl;
}

.container {
  background: #fff;
  padding: 30px;
  border-radius: 15px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.1);
  width: 90%;
  max-width: 600px;
}

h1 {
  text-align: center;
  color: #333;
  margin-bottom: 20px;
}

textarea {
  width: 100%;
  height: 200px;
  font-size: 18px;
  padding: 15px;
  border-radius: 10px;
  border: 1px solid #ccc;
  resize: none;
  direction: rtl;
  text-align: right;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 15px;
  font-size: 20px;
  border: none;
  border-radius: 10px;
  background-color: #28a745; /* أخضر واضح */
  color: white;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background-color: #218838;
}

#message {
  text-align: center;
  margin-top: 10px;
  font-size: 18px;
  color: #155724; /* أخضر نجاح */
  display: none;
}

#currentNotesContainer {
  margin-top: 20px;
  padding-top: 10px;
  border-top: 2px solid #ccc;
}

#currentNotesContainer h2 {
  font-size: 22px;
  margin-bottom: 10px;
}

ul#currentNotes {
  list-style-type: disc;
  padding-right: 20px;
  font-size: 18px;
  line-height: 1.5;
  cursor: pointer;
}

ul#currentNotes li:hover {
  background-color: #e0ffe0;
  border-radius: 5px;
  padding: 2px 5px;
}
</style>
</head>
<body>

<div class="container">
  <h1>✏️ اكتب ملاحظتك</h1>
  <textarea id="note" placeholder="اكتب هنا..."></textarea>
  <button onclick="send()">إرسال الملاحظة</button>
  <div id="message">✅ تم إرسال الملاحظة بنجاح!</div>

  <div id="currentNotesContainer">
    <h2>الملاحظات الحالية (اضغط لتعديل)</h2>
    <ul id="currentNotes"></ul>
  </div>
</div>

<script src="https://cdn.ably.io/lib/ably.min-1.js"></script>
<script>
  const ably = new Ably.Realtime("d7XY8g.iffthg:fC1_V_gyW5XuWkef5gjz8WAQ68AwXA3k3e-SXIVTC0U");
  const channel = ably.channels.get("notes");
  const messageEl = document.getElementById("message");
  const currentNotesUl = document.getElementById("currentNotes");
  const noteTextarea = document.getElementById("note");

  function renderNotes(text) {
    const lines = text.split('\n');
    currentNotesUl.innerHTML = '';
    lines.forEach(line => {
      if(line.trim() !== '') {
        const li = document.createElement('li');
        li.textContent = line;
        // ميزة النسخ السريع: عند الضغط، توضع في مربع الكتابة
        li.addEventListener('click', () => {
          noteTextarea.value = line;
          noteTextarea.focus();
        });
        currentNotesUl.appendChild(li);
      }
    });
  }

  // ---------- تحميل الملاحظات من localStorage عند فتح الصفحة ----------
  const savedNotes = localStorage.getItem("dailyNotes");
  if(savedNotes) {
    renderNotes(savedNotes);
  }

  // ---------- عند استلام ملاحظة جديدة من Ably ----------
  channel.subscribe("new-note", msg => {
    const text = msg.data.text;
    renderNotes(text);
    localStorage.setItem("dailyNotes", text);
  });

  // ---------- إرسال الملاحظة ----------
  function send() {
    const text = noteTextarea.value;
    if(text.trim() === "") return;

    channel.publish("new-note", { text });

    messageEl.style.display = "block";
    setTimeout(() => { messageEl.style.display = "none"; }, 2000);

    noteTextarea.value = "";
  }
</script>

</body>
</html>
