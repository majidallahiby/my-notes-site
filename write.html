  <title>📓 كتابة الملاحظات</title>
<style>
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: #f0f4f8;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
  margin: 0;
  padding-top: 50px;
  direction: rtl;
}

.container {
  background: #fff;
  padding: 30px;
  border-radius: 15px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.1);
  width: 90%;
  max-width: 600px;
}

h1 {
  text-align: right;
  color: #333;
  margin-bottom: 20px;
}

textarea {
  width: 95%;
  height: 200px;
  font-size: 18px;
  padding: 15px;
  border-radius: 10px;
  border: 1px solid #ccc;
  resize: none;
  direction: rtl;
  text-align: right;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 15px;
  font-size: 20px;
  border: none;
  border-radius: 10px;
  background-color: #28a745; /* أخضر واضح */
  color: white;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background-color: #218838;
}

#message {
  text-align: center;
  margin-top: 10px;
  font-size: 18px;
  color: #155724; /* أخضر نجاح */
  display: none;
}

#currentNotesContainer {
  margin-top: 20px;
  padding-top: 10px;
  border-top: 2px solid #ccc;
}

#currentNotesContainer h2 {
  font-size: 22px;
  margin-bottom: 10px;
}

ul#currentNotes {
  list-style-type: disc;
  padding-right: 20px;
  font-size: 18px;
  line-height: 1.5;
  cursor: pointer;
}

ul#currentNotes li:hover {
  background-color: #e0ffe0;
  border-radius: 5px;
  padding: 2px 5px;
}
.header button {

  padding: 8px 15px;
  font-size: 18px;
  margin-left: 10px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  background-color: #4CAF50;
  color: white;
}
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

</style>

</head>
<body>
<div class="container">
 <div class="header">
  <h2>✏️ اكتب ملاحظاتك:</h2>
<button onclick="showAlertMessage()" style="width:5px">!</button>
</div>
  <textarea id="noteInput" placeholder="اكتب ملاحظتك هنا..."></textarea>

  <br />
  <button onclick="sendNote()">إرسال</button>

  <div id="status"></div>




  <h2>الملاحظات الحالية</h2>
  <div id="currentNotes" class="box">جاري التحميل...</div>
</div>




<script src="https://cdn.ably.io/lib/ably.min-1.js"></script>




  <script>

  const ably = new Ably.Realtime("d7XY8g.iffthg:fC1_V_gyW5XuWkef5gjz8WAQ68AwXA3k3e-SXIVTC0U");
  const channel = ably.channels.get("notes");
  const messageEl = document.getElementById("message");
  const currentNotesUl = document.getElementById("currentNotes");
  const noteTextarea = document.getElementById("noteInput");

  function renderNotes(text) {
    const lines = text.split('\n');
    currentNotesUl.innerHTML = '';
    lines.forEach(line => {
      if(line.trim() !== '') {
        const li = document.createElement('li');
        li.textContent = line;
        // ميزة النسخ السريع: عند الضغط، توضع في مربع الكتابة
        li.addEventListener('click', () => {
          noteTextarea.value = line;
          noteTextarea.focus();
        });
        currentNotesUl.appendChild(li);
      }
    });
  }

 
  // ---------- عند استلام ملاحظة جديدة من Ably ----------
  channel.subscribe("new-note", msg => {
    const text = msg.data.text;
    renderNotes(text);

  });


    // ----------------------------------

    // ----------------------
    // إرسال الملاحظة
    // ----------------------
   async function sendNote() {

  const text = document.getElementById("noteInput").value.trim();
    if(text.trim() === "") return;
    channel.publish("new-note", { text });
  if (!text) return;

  const { error } = await supabase
    .from("notes")
    .update({ text: text })     // تحديث قيمة الحقل text
    .eq("id", 2);               // تحديث السطر الذي id=2

  if (!error) {
    document.getElementById("status").innerHTML = "✔ تم تحديث الملاحظة بنجاح";
    document.getElementById("noteInput").value = "";
    loadNotes();
  } else {
    document.getElementById("status").innerHTML = "❌ خطأ بالتحديث";
  }
}


    // ----------------------
    // تحميل الملاحظات الحالية
    // ----------------------
    async function loadNotes() {
      const { data, error } = await supabase
        .from("notes")
        .select("*")
        .order("id", { ascending: false });

      if (error) {
        document.getElementById("currentNotes").innerHTML = "خطأ بالتحميل";
        return;
      }

      if (data.length === 0) {
        document.getElementById("currentNotes").innerHTML = "لا توجد ملاحظات حاليا";
        return;
      }

      let html = "";
      data.forEach(n => {
        html += `${n.text}`;
  if(html) {
      const lines = html.split('\n');
      currentNotes.innerHTML = '';
      lines.forEach(line => {
        if(line.trim() !== '') {
          const li = document.createElement('li');
          li.textContent = line;
          currentNotes.appendChild(li);
        }
      });
    }

      });

    }

    // تحميل الملاحظات عند فتح الصفحة
    loadNotes();
  </script>

</html>
