<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📓 اكتب ملاحظاتك</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
/* --- جسم الصفحة والمربع --- */
/* --- جسم الصفحة والمربع --- */
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #f0f4f8;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    margin: 0;
    padding-top: 50px;
    direction: rtl;
}

.container {
    background: #fff;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    width: 90%;
    max-width: 600px;
    display: flex;
    flex-direction: column;
    align-items: stretch; /* يجعل المحتوى يمتد بعرض المربع */
}

/* --- العنوان مع أيقونة القلم --- */
 .header {
    display: flex;
    justify-content: space-between; /* العنوان جهة اليمين والأزرار جهة اليسار */
    align-items: center;
    direction: rtl;
    margin-bottom: 15px;
}

.header-left {
    display: flex;
    align-items: center;
}

.header-left h2 {
    margin: 0;
    order: 2;
}

.header-left img {
    width: 24px;
    height: 24px;
    margin-left: 10px;
    order: 1;
}
.header-right {
    display: flex;
    gap: 5px; /* مسافة صغيرة بين الأزرار */
}

.header-right button {
    padding: 3px 20px; /* صغير الحجم */
    border-radius: 8px;
    border: none;
    cursor: pointer;
    transition: all 0.2s ease;
}

/* تأثير hover و active */
.header-right button:hover { filter: brightness(1.1); }
.header-right button:active { filter: brightness(0.9); }

/* إذا أردت تخصيص لون لكل زر */
#toggleScroll { background-color: #CB64DD; }
#showMsg { background-color: #9696FF; color:#fff; padding: 3px 25px; }

/* --- مربع النص --- */
textarea {
    width: 100%;
    height: 150px;
    padding: 10px;
    font-size: 16px;
    border-radius: 10px;
    border: 1px solid #ccc;
    resize: none;
    margin-bottom: 15px;
}
   /* --- حاوية الأزرار --- */
.button-group {
    display: flex;
    justify-content: space-between; /* توزيع متساوي بينهم */
    gap: 10px; /* مسافة صغيرة بين الأزرار */
    margin-bottom: 15px;
}

/* --- الأزرار --- */
.button-group button {
    flex: 1; /* يجعل كل زر يأخذ نفس المساحة */
    padding: 12px 0;
    font-size: 16px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    color: white;
    transition: all 0.2s ease;
}

/* ألوان الأزرار */
#sendBtn { background-color: #28a745; }
#editBtn { background-color: #ffc107; color: black; }
#deleteBtn { background-color: #dc3545; }

/* تأثير hover */
.button-group button:hover {
    filter: brightness(1.1);
}

/* تأثير الضغط */
.button-group button:active {
    filter: brightness(0.9);
}


.notes-scroll-wrapper {
    position: relative;
    overflow: hidden;
    height: 270px;
}

.notes-list {
    position: absolute;
    width: 100%;
    top: 0;
}




.notes-list li {
    margin-bottom: 6px;
    padding: 10px 12px;
    border-radius: 6px;
    background: #f2f2f2;
    cursor: pointer;
    transition: background 0.2s ease;
}


/* التحديد */
.notes-list li.selected {
    background: #d1e7dd;
}

/* نص الملاحظة */
.note-text {
    line-height: 1.5;
}

/* التاريخ (مخفي افتراضيًا) */
.note-time {
    font-size: 16px;
    color: #666;
    margin-top: 4px;
    display: none;
}

/* يظهر عند hover */
.notes-list li:hover .note-time {
    display: block;
}

/* يظهر عند التحديد */
.notes-list li.selected .note-time {
    display: block;
}



.app-footer {
    position: fixed;
    bottom: 8px;
    width: 100%;
    font-size: 14px;
    color: #666;
    opacity: 0.8;
    pointer-events: none;
    direction: rtl;
    display: flex;
    transition: opacity 0.3s ease;
}

.app-footer .footer-center {
    margin: 0 auto;
    pointer-events: auto;
}

.app-footer .footer-right {
    pointer-events:auto;
}

body.dark-mode .app-footer {
    color: #aaa;
}


</style>
</head>
<footer class="app-footer">
    <span class="footer-center">© <span id="year"></span> جميع الحقوق محفوظة – تصميم وتنفيذ شعبة تقنية المعلومات (IT)</span>
    <span class="footer-right">Majid Allahiby&nbsp;&nbsp;&nbsp;&nbsp;</span>
</footer>
<body>

<div class="container">

       <div class="header">
    <div class="header-left">
                  <h2 class="page-title">
    ✏️ اكتب ملاحظاتك
</h2>
    </div>
    <div class="header-right">
        <button id="toggleScroll">⏹️</button>
        <button id="showMsg">!</button>

    </div>
</div>





    <textarea id="noteInput" placeholder="اكتب ملاحظتك هنا..."></textarea>
    <div>
        <div class="button-group">
    <button id="sendBtn">إرسال</button>
    <button id="editBtn">تعديل</button>
    <button id="deleteBtn">حذف</button>
</div>

    </div>
    <div class="notes-scroll-wrapper">

    <ul class="notes-list" id="notesList"></ul>
</div>


</div>

<script>
const SUPABASE_URL = "https://ecikwipkukvyqipejlay.supabase.co"; // ضع هنا رابط المشروع
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVjaWt3aXBrdWt2eXFpcGVqbGF5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM1NzIxMzEsImV4cCI6MjA3OTE0ODEzMX0.LXeXcwG00I4yaNQrlGeZCMDTllecH6QyUpB9BTrCY08"; // ضع هنا ANON_KEY
window.supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const NameTable = "notes";
//const NameTable = "test_notes";

const noteInput = document.getElementById("noteInput");
const sendBtn = document.getElementById("sendBtn");
const editBtn = document.getElementById("editBtn");
const deleteBtn = document.getElementById("deleteBtn");
const notesList = document.getElementById("notesList");

let selectedNoteId = null;

/* ------------------- تحميل الملاحظات ------------------- */
async function loadNotes() {
    const { data, error } = await supabaseClient
        .from(NameTable)
        .select("*")
        .order("id", { ascending: true });

    if (error) { alert("خطأ في تحميل الملاحظات"); return; }

    notesList.innerHTML = "";
   // data.forEach(note => addNoteToList(note));

    data.forEach(n => {
        const li = document.createElement("li");

        // النص + التاريخ
        const time = new Date(n.updated_at).toLocaleString('en-EG', {
            hour12: true,
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
        });

        li.innerHTML = `<span class="note-text">${n.text}</span>
                                        <span class="note-time">(${time})</span>`;
      /*
        // اختيار الملاحظة للتعديل
        li.addEventListener("click", () => {
            noteInput.value = n.text;
            selectedNoteId = n.id;
        });
             */
        li.addEventListener("click", () => {

    // إزالة التحديد من جميع الملاحظات
    document.querySelectorAll(".notes-list li").forEach(item => {
        item.classList.remove("selected");
    });

    // إضافة التحديد للملاحظة الحالية
    li.classList.add("selected");

    // تحميل النص في مربع الكتابة
      noteInput.value = n.text;
      selectedNoteId = n.id;
      });

        notesList.appendChild(li);
    });

 }

/* ------------------- إضافة ملاحظة للقائمة ------------------- */
function addNoteToList(note) {
    const li = document.createElement("li");
    li.textContent = note.text;
    li.dataset.id = note.id;

    li.addEventListener("click", () => {
        selectedNoteId = note.id;
        noteInput.value = note.text;

        notesList.querySelectorAll("li").forEach(el => el.classList.remove("selected"));
        li.classList.add("selected");
    });

    // إزالة إذا موجودة مسبقاً
    const existing = notesList.querySelector(`li[data-id='${note.id}']`);
    if (existing) existing.replaceWith(li);
    else notesList.appendChild(li);
}

/* ------------------- زر الإرسال ------------------- */
sendBtn.addEventListener("click", async () => {
    const text = noteInput.value.trim();
    if (!text) return;

    const { data, error } = await supabaseClient.from(NameTable).insert([{ text: text, created_at: new Date(), updated_at: new Date() }]);
    if (error) { alert("خطأ في الإرسال"); return; }

    noteInput.value = "";
    selectedNoteId = null;

    loadNotes();
});

/* ------------------- زر التعديل ------------------- */
editBtn.addEventListener("click", async () => {
    const newtext = noteInput.value.trim();
    if (!newtext || !selectedNoteId) return;

    const { data, error } = await supabaseClient
        .from(NameTable)
        .update({ text: newtext , updated_at: new Date() })
        .eq("id", selectedNoteId);

    if (error) { alert("خطأ في التعديل"); return; }

    noteInput.value = "";
    selectedNoteId = null;
    loadNotes();

});

/* ------------------- زر الحذف ------------------- */
deleteBtn.addEventListener("click", async () => {
    if (!selectedNoteId) return;

    const { data, error } = await supabaseClient
        .from(NameTable)
        .delete()
        .eq("id", selectedNoteId);

    if (error) { alert("خطأ في الحذف"); return; }

    noteInput.value = "";
    selectedNoteId = null;
    loadNotes();
});

/*.......................................................*/
const notesList2 = document.querySelector('.notes-list');

notesList.addEventListener('mouseenter', (e) => {
    if(e.target.tagName === 'LI') {
        notesList2.style.animationPlayState = 'paused';
    }
}, true);

notesList.addEventListener('mouseleave', (e) => {
    if(e.target.tagName === 'LI') {
        notesList2.style.animationPlayState = 'running';
    }
}, true);

/*......................................................*/

 document.getElementById("showMsg").addEventListener("click", () => {
   const msg="(IT)تصميم وتنفيذ شعبة تقنية المعلومات"
        + "\n" + "مــــــاجـــــد جـــــــمــــال اللـــهــيـــبـــي"
        + "\n" +  "احـــــمــــــــد إبــــــراهــــــــيم مــــــــداح"
        +  "\n" + "عــــــمــــــــر عــــاصـــــم نــــاجــــــــــي" ;
        alert(msg);
});


/* ------------------- Realtime ------------------- */
supabaseClient
    .channel('public:NameTable')
 /*   .channel('public:notes')  */
    .on('postgres_changes', { event: '*', schema: 'public', table: NameTable }, payload => {
  /*  .on('postgres_changes', { event: '*', schema: 'public', table: 'notes' }, payload => {     */
        if (payload.eventType === 'INSERT' || payload.eventType === 'UPDATE') {
            addNoteToList(payload.new);
        } else if (payload.eventType === 'DELETE') {
            const li = notesList.querySelector(`li[data-id='${payload.old.id}']`);
            if (li) li.remove();
        }
    })
    .subscribe();
/* ------------------- تحميل أولي ------------------- */


/*............... حركة الملاحظات ......................*/
const wrapper = document.querySelector('.notes-scroll-wrapper');
const list = document.querySelector('.notes-list');

let offset = wrapper.offsetHeight;
let speed = 0.3; // سرعة الحركة
let isRunning = true;

function animateNotes() {
    if (!isRunning) return;

    offset -= speed;
    list.style.transform = `translateY(${offset}px)`;

    const listHeight = list.offsetHeight;

    // أول ما آخر ملاحظة تطلع بالكامل
    if (offset <= -listHeight) {
        offset = wrapper.offsetHeight;
    }

    requestAnimationFrame(animateNotes);
}

// تشغيل أولي
animateNotes();


/*...........................................................*/

/*..............تشغيل الحركة وايقافها.......................*/
const toggleScrollBtn =document.getElementById("toggleScroll");
toggleScrollBtn.addEventListener('click', () => {
    isRunning = !isRunning;

    if (isRunning) {
        requestAnimationFrame(animateNotes);
        toggleScrollBtn.textContent = "⏹️";
    } else {
        // إلغاء الحركة وإظهار كل الملاحظات
        list.style.transform = 'translateY(0)';
        toggleScrollBtn.textContent = "▶️";
    }
});


/*.....................................................*/


/*.............. footer ..............................*/
// تحديث السنة تلقائيًا
document.getElementById('year').textContent = new Date().getFullYear();

// إخفاء footer عند عدم حركة الماوس لمدة 3 ثواني
let footer = document.querySelector('.app-footer');
let timeoutId;

function showFooter() {
    footer.style.opacity = '0.8';
    clearTimeout(timeoutId);
    timeoutId = setTimeout(() => {
        footer.style.opacity = '0';
    }, 5000);
}

// عند تحريك الماوس نعيد الظهور
document.addEventListener('mousemove', showFooter);

// تشغيل لأول مرة
showFooter();

/*...................................................*/




loadNotes();
</script>

</body>
</html>
