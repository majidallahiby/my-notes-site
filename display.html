<!DOCTYPE html>

<title>📺 الملاحظات اليومية</title>
<style>
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  margin: 0;
  padding: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  transition: background 1s linear;
  color: #333;
}

.container {
  width: 100%;
  max-width: 900px;
  background: rgba(255,255,255,0.5);
  border-radius: 20px;
  padding: 30px;
  box-sizing: border-box;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

h1 {
  font-size: 40px;
  margin: 0;
}

.controls button {
  padding: 8px 15px;
  font-size: 18px;
  margin-left: 10px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  background-color: #4CAF50;
  color: white;
}

.controls button:hover {
  background-color: #45a049;
}

ul#currentNotes {
  list-style-type: disc;
  padding-right: 20px;
  font-size: 32px;
  line-height: 1.6;
}
</style>

</head>

 <button onclick="showAlertMessage()">!</button>

  </div>

    async function loadNotes() {
      const { data, error } = await supabase
        .from("notes")
        .select("*")
        .order("id", { ascending: false });

        document.getElementById("currentNotes").innerHTML = "خطأ بالتحميل";

      }

        document.getElementById("currentNotes").innerHTML = "لا توجد ملاحظات حاليا";
        return;
      }

      let html = "";
      data.forEach(n => {
        html += `${n.text}`;

      lines.forEach(line => {

          currentNotes.appendChild(li);
        }
      });
    }
