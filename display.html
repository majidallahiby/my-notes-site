<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>📺 الملاحظات اليومية</title>
<style>
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  margin: 0;
  padding: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  transition: background 1s linear;
  color: #333;
}

.container {
  width: 90%;
  max-width: 900px;
  background: rgba(255,255,255,0.5);
  border-radius: 20px;
  padding: 30px;
  box-sizing: border-box;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

h1 {
  font-size: 40px;
  margin: 0;
}

.controls button {
  padding: 8px 15px;
  font-size: 18px;
  margin-left: 10px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  background-color: #4CAF50;
  color: white;
}

.controls button:hover {
  background-color: #45a049;
}

ul#view {
  list-style-type: disc;
  padding-right: 20px;
  font-size: 32px;
  line-height: 1.6;
}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>📌 الملاحظات اليومية</h1>
    <div class="controls">
      <button onclick="changeFontSize(2)">A+</button>
      <button onclick="changeFontSize(-2)">A-</button>
    </div>
  </div>
  <ul id="view"></ul>
</div>

<script src="https://cdn.ably.io/lib/ably.min-1.js"></script>
<script>
  const view = document.getElementById("view");

  // ---------- التحكم بحجم الخط ----------
  function changeFontSize(delta) {
    const current = parseInt(window.getComputedStyle(view).fontSize);
    view.style.fontSize = (current + delta) + "px";
  }

  // ---------- ألوان التدرج اليومية ----------
  const gradientColors = [
    ["#fbeee6","#fceeea"], ["#f4f4f4","#eaf4f8"], ["#f4f0f4","#f0f8f0"],
    ["#f0f8ea","#f9f9f9"], ["#f5eef8","#f0f0f5"], ["#fafaf0","#f0faf4"],
    ["#f7f0e6","#f0f7f4"], ["#f0f0f8","#f4f0f0"], ["#f0f4ff","#f4f8f0"],
    ["#f9f0f0","#f0f0f5"], ["#f0faf4","#f0f4f0"], ["#f7f7f7","#f8f0f0"],
    ["#f0f8f7","#f4f4f4"], ["#fbeee6","#f0f8f0"], ["#f4f4f4","#f0f4ff"],
    ["#f0f0f0","#fafaf0"], ["#f5f5dc","#f0fff0"], ["#f0f4f0","#f4f0f4"],
    ["#f9f9f0","#f0f5fa"], ["#f7f0e6","#f0f7f4"], ["#f0f0f8","#f4f0f0"],
    ["#f0f4ff","#f4f8f0"], ["#f9f0f0","#f0f0f5"], ["#f0faf4","#f0f4f0"],
    ["#f7f7f7","#f8f0f0"], ["#f0f8f7","#f4f4f4"], ["#fbeee6","#f0f8f0"],
    ["#f4f4f4","#f0f4ff"], ["#f0f0f0","#fafaf0"], ["#f5f5dc","#f0fff0"]
  ];
  const today = new Date();
  const dayIndex = (today.getDate() - 1) % 30;
  const [color1, color2] = gradientColors[dayIndex];
  document.body.style.background = `linear-gradient(135deg, ${color1}, ${color2})`;

  // ---------- تحميل الملاحظات من localStorage ----------
  function loadNotes() {
    const saved = localStorage.getItem("dailyNotes");
    if(saved) {
      const lines = saved.split('\n');
      view.innerHTML = '';
      lines.forEach(line => {
        if(line.trim() !== '') {
          const li = document.createElement('li');
          li.textContent = line;
          view.appendChild(li);
        }
      });
    }
  }
  loadNotes();

  // ---------- إعداد Ably ----------
  const ably = new Ably.Realtime("d7XY8g.iffthg:fC1_V_gyW5XuWkef5gjz8WAQ68AwXA3k3e-SXIVTC0U");
  const channel = ably.channels.get("notes");

  channel.subscribe("new-note", msg => {
    const lines = msg.data.text.split('\n');
    view.innerHTML = '';
    lines.forEach(line => {
      if(line.trim() !== '') {
        const li = document.createElement('li');
        li.textContent = line;
        view.appendChild(li);
      }
    });
    // حفظ الملاحظات في localStorage
    localStorage.setItem("dailyNotes", msg.data.text);
  });
</script>

</body>
</html>
